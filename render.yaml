services:
  - type: web
    runtime: static
    name: jbr-admin-demo
    branch: main
    buildCommand: npm ci && npm run build:web
    staticPublishPath: ./dist
    envVars:
      - key: VITE_LOCAL_DEMO_MODE
        value: "true"
      - key: VITE_ALLOW_PRODUCTION_DEMO
        value: "true"
      - key: VITE_PUBLIC_CATALOG_WRITES
        value: "false"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
